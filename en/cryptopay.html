<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crypto Payment • 2051</title>

  <style>
    html { min-height:100%; background:#000; }
    body {
      margin:0; min-height:100%; background:#000; color:#e7eef7;
      font:16px/1.5 Arial, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif;
      overflow-y:auto;
    }

    /* Глобальный фикс для размеров */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* ВИДЕОФОН */
    #bgVideo{
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0; pointer-events:none; background:#000;
    }

    /* Контент */
    .page { position:relative; z-index:1; min-height:100vh; display:grid; place-items:center; padding:20px; box-sizing:border-box; }
    .card{
      width:min(560px, 96%); background:rgba(8,12,18,.78);
      border:1px solid rgba(180,240,255,.25); border-radius:16px; padding:22px 20px;
      box-shadow:0 10px 40px rgba(0,0,0,.45); backdrop-filter: blur(6px);
      text-align:center;
    }
    h1{ margin:0 0 10px; font-size:22px; }
    p.sub{ margin:0 0 16px; color:#bcd0e0; }

    label{ display:block; margin:14px 0 6px; text-align:center; color:#dbe7f3; font-weight:600; }
    input{
      width: 100%;
      max-width: 100%;
      display: block;
      margin: 0;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #233142;
      background:#0d141c;
      color:#e7eef7;
      box-sizing: border-box;
    }
    input::placeholder{ color:#8fa5ba; }

    .btn{
      width:100%; display:inline-flex; align-items:center; justify-content:center; gap:8px;
      margin-top:16px; padding:12px 14px; border-radius:12px; border:0; cursor:pointer; font-weight:700;
      background:#22c55e; color:#081219; transition:transform .12s ease, filter .2s ease;
    }
    .btn:hover{ transform:translateY(-1px); filter:brightness(1.05); }
    .note{ margin-top:10px; color:#9fb4c7; font-size:14px; }
    .err{ margin-top:10px; color:#ff7a7a; font-size:14px; display:none; }
    .err.show{ display:block; }

    @media (max-width:420px){
      .card{ padding:18px 14px; }
      h1{ font-size:20px; }
    }
  
  /* Language switch */
  .lang-switch{position:fixed;top:14px;right:14px;z-index:10000;display:flex;align-items:center;gap:4px;padding:5px;background:rgba(5,10,16,.78);border:1px solid rgba(185,238,255,.35);border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.35);backdrop-filter:blur(8px);font:700 12px/1 Arial,system-ui,sans-serif;letter-spacing:.06em}
  .lang-switch a,.lang-switch span{display:block;padding:7px 9px;border-radius:999px;text-decoration:none;color:#d9eef8}
  .lang-switch .active{background:rgba(112,214,255,.22);color:#fff}
  .lang-switch-home{top:58px}

  /* Mobile vertical language switch */
  @media (max-width: 620px) {
    .lang-switch {
      top: calc(8px + env(safe-area-inset-top));
      right: max(3px, env(safe-area-inset-right));
      flex-direction: column;
      align-items: stretch;
      gap: 1px;
      padding: 3px;
      border-radius: 12px;
      font-size: 10px;
    }

    .lang-switch a,
    .lang-switch span {
      min-width: 27px;
      padding: 6px 4px;
      text-align: center;
      border-radius: 8px;
    }

    .lang-switch-home {
      top: calc(8px + env(safe-area-inset-top));
    }

    /* On the home page, reserve a slim lane for the vertical switch. */
    .fixed-line-top {
      left: 8px;
      right: calc(43px + env(safe-area-inset-right));
      transform: none;
      max-width: none;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
  }

</style>

  <script>
    // Авто-выбор доступного API
    (function(){
      const q = new URLSearchParams(location.search);
      const override = q.get('api');
      const candidates = [];
      if (override) candidates.push(override.replace(/\/$/, ''));
      if (window.API_BASE) candidates.push(String(window.API_BASE).replace(/\/$/, ''));
      candidates.push(location.origin);
      candidates.push('https://raykedy.workers.dev');
      candidates.push('https://rk-pay.workers.dev');
      window.API_CANDIDATES = [...new Set(candidates)];
      window.pickApi = async function(){
        for (const base of window.API_CANDIDATES){
          try{
            const r = await fetch(base + '/api/order-status?order=test', { method:'GET' });
            if (r.ok) return base;
          }catch(_){}
        }
        return window.API_CANDIDATES[0];
      }
    })();
  </script>

  <link rel="alternate" hreflang="ru" href="https://raykedy.com/cryptopay.html">
  <link rel="alternate" hreflang="en" href="https://raykedy.com/en/cryptopay.html">
</head>
<body>
<nav class="lang-switch" aria-label="Language"><a href="../cryptopay.html" lang="ru" hreflang="ru">RU</a><span class="active">EN</span></nav>

  <!-- Видео как на главной -->
  <video id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source src="https://raykedy.github.io/fastvideobackground_faststart.mp4" type="video/mp4">
  </video>

  <main class="page">
    <section class="card" aria-label="Crypto payment">
      <h1>Crypto Payment</h1>
      <p class="sub">
        Enter your email address. After payment, a download link will be sent to you and remain active for one hour.<br/>
        If it does not appear in your inbox, please check your spam folder.
      </p>

      <label for="email">Email address for book delivery</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />

      <!-- Выбор монеты убран -->
      <button class="btn" id="payBtn">Proceed to Payment</button>

      <div class="note">Payments and transaction security are handled by NOWPayments.</div>
      <div class="err" id="errBox"></div>
    </section>
  </main>

  <script>
    const $ = s => document.querySelector(s);

    $("#payBtn").addEventListener("click", async ()=>{
      const err = $("#errBox");
      err.classList.remove('show'); err.textContent = '';

      const email = $("#email").value.trim();
      if (!email) { err.textContent = "Please enter your email address"; err.classList.add('show'); return; }

      const amountUsd = 3.99;
      const asset = ""; // «Любая» монета

      try {
        const API_BASE = await window.pickApi();
        const r = await fetch(API_BASE + '/api/create-invoice', {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ email, amountUsd, asset })
        });
        const d = await r.json();
        if (d.ok && d.url) {
          location.href = d.url;
        } else {
          err.textContent = "We could not create the invoice. Please try again.";
          err.classList.add('show');
          console.log("create-invoice fail:", d);
        }
      } catch (e) {
        err.textContent = "The network is unavailable. Please try again.";
        err.classList.add('show');
        console.error(e);
      }
    });
  </script>

</body>
</html>
