<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment Cancelled • 2051</title>

  <style>
    html { min-height:100%; background:#000; }
    body {
      margin:0; min-height:100%; background:#000; color:#e7eef7;
      font:16px/1.5 Arial, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif;
      overflow-y:auto;
    }

    /* ВИДЕОФОН — как на success/cryptopay */
    #bgVideo{
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0; pointer-events:none; background:#000;
    }

    /* Контент */
    .page { position:relative; z-index:1; min-height:100vh; display:grid; place-items:center; padding:20px; box-sizing:border-box; }
    .card{
      width:min(560px, 96%); background:rgba(8,12,18,.78);
      border:1px solid rgba(180,240,255,.25); border-radius:16px; padding:22px 20px;
      box-shadow:0 10px 40px rgba(0,0,0,.45); backdrop-filter: blur(6px);
      text-align:center;
    }
    h1{ margin:0 0 10px; font-size:22px; }
    p{ margin:0 0 12px; color:#bcd0e0; }

    a.btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:12px 14px; border-radius:12px; border:0;
      background:#233142; color:#dbe8f5; text-decoration:none; font-weight:600;
      transition:transform .12s ease, filter .2s ease;
      width:100%;
    }
    a.btn:hover{ transform:translateY(-1px); filter:brightness(1.05); }

    @media (max-width:420px){
      .card{ padding:18px 14px; }
      h1{ font-size:20px; }
    }
  
  /* Language switch */
  .lang-switch{position:fixed;top:14px;right:14px;z-index:10000;display:flex;align-items:center;gap:4px;padding:5px;background:rgba(5,10,16,.78);border:1px solid rgba(185,238,255,.35);border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.35);backdrop-filter:blur(8px);font:700 12px/1 Arial,system-ui,sans-serif;letter-spacing:.06em}
  .lang-switch a,.lang-switch span{display:block;padding:7px 9px;border-radius:999px;text-decoration:none;color:#d9eef8}
  .lang-switch .active{background:rgba(112,214,255,.22);color:#fff}
  .lang-switch-home{top:58px}

  /* Mobile vertical language switch */
  @media (max-width: 620px) {
    .lang-switch {
      top: calc(8px + env(safe-area-inset-top));
      right: max(3px, env(safe-area-inset-right));
      flex-direction: column;
      align-items: stretch;
      gap: 1px;
      padding: 3px;
      border-radius: 12px;
      font-size: 10px;
    }

    .lang-switch a,
    .lang-switch span {
      min-width: 27px;
      padding: 6px 4px;
      text-align: center;
      border-radius: 8px;
    }

    .lang-switch-home {
      top: calc(8px + env(safe-area-inset-top));
    }

    /* On the home page, reserve a slim lane for the vertical switch. */
    .fixed-line-top {
      left: 8px;
      right: calc(43px + env(safe-area-inset-right));
      transform: none;
      max-width: none;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
  }

</style>

  <link rel="alternate" hreflang="ru" href="https://raykedy.com/cancel.html">
  <link rel="alternate" hreflang="en" href="https://raykedy.com/en/cancel.html">
</head>
<body>
<nav class="lang-switch" aria-label="Language"><a href="../cancel.html" lang="ru" hreflang="ru">RU</a><span class="active">EN</span></nav>

  <!-- Видео как на других страницах -->
  <video id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source src="https://raykedy.github.io/fastvideobackground_faststart.mp4" type="video/mp4">
  </video>

  <main class="page">
    <section class="card" aria-label="Payment cancelled">
      <h1>Payment Cancelled</h1>
      <p>You can return to the payment page and try again.</p>
      <a class="btn" href="cryptopay.html">← Return to Payment</a>
    </section>
  </main>

</body>
</html>
