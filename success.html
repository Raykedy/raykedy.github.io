<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Оплата получена • 2051</title>

  <style>
    html { min-height:100%; background:#000; }
    body {
      margin:0; min-height:100%; background:#000; color:#e7eef7;
      font:16px/1.5 Arial, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, sans-serif;
      overflow-y:auto;
    }

    /* ВИДЕОФОН — как на cryptopay */
    #bgVideo{
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:0; pointer-events:none; background:#000;
    }

    /* Контент поверх видео */
    .page { position:relative; z-index:1; min-height:100vh; display:grid; place-items:center; padding:20px; box-sizing:border-box; }
    .card{
      width:min(560px, 96%); background:rgba(8,12,18,.78);
      border:1px solid rgba(180,240,255,.25); border-radius:16px; padding:22px 20px;
      box-shadow:0 10px 40px rgba(0,0,0,.45); backdrop-filter: blur(6px);
      text-align:center; /* всё по центру */
    }
    h1{ margin:0 0 10px; font-size:22px; }
    p{ margin:0 0 10px; }
    .muted{ color:#bcd0e0; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:12px 14px; border-radius:12px; border:0; cursor:pointer; font-weight:700;
      background:#233142; color:#dbe8f5; transition:transform .12s ease, filter .2s ease;
      width:100%;
    }
    .btn:hover{ transform:translateY(-1px); filter:brightness(1.05); }

    .note{ margin-top:10px; color:#9fb4c7; font-size:14px; }
    .ok{ margin-top:12px; color:#9ef; }
    .err{ margin-top:12px; color:#ff7a7a; display:none; }
    .err.show{ display:block; }

    @media (max-width:420px){
      .card{ padding:18px 14px; }
      h1{ font-size:20px; }
    }
  
  /* Language switch */
  .lang-switch{position:fixed;top:14px;right:14px;z-index:10000;display:flex;align-items:center;gap:4px;padding:5px;background:rgba(5,10,16,.78);border:1px solid rgba(185,238,255,.35);border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.35);backdrop-filter:blur(8px);font:700 12px/1 Arial,system-ui,sans-serif;letter-spacing:.06em}
  .lang-switch a,.lang-switch span{display:block;padding:7px 9px;border-radius:999px;text-decoration:none;color:#d9eef8}
  .lang-switch .active{background:rgba(112,214,255,.22);color:#fff}
  .lang-switch-home{top:58px}

  /* Mobile vertical language switch */
  @media (max-width: 620px) {
    .lang-switch {
      top: calc(8px + env(safe-area-inset-top));
      right: max(3px, env(safe-area-inset-right));
      flex-direction: column;
      align-items: stretch;
      gap: 1px;
      padding: 3px;
      border-radius: 12px;
      font-size: 10px;
    }

    .lang-switch a,
    .lang-switch span {
      min-width: 27px;
      padding: 6px 4px;
      text-align: center;
      border-radius: 8px;
    }

    .lang-switch-home {
      top: calc(8px + env(safe-area-inset-top));
    }

    /* On the home page, reserve a slim lane for the vertical switch. */
    .fixed-line-top {
      left: 8px;
      right: calc(43px + env(safe-area-inset-right));
      transform: none;
      max-width: none;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
  }

</style>

  <link rel="alternate" hreflang="ru" href="https://raykedy.com/success.html">
  <link rel="alternate" hreflang="en" href="https://raykedy.com/en/success.html">
</head>
<body>
<nav class="lang-switch" aria-label="Language"><span class="active">RU</span><a href="en/success.html" lang="en" hreflang="en">EN</a></nav>

  <!-- Видео как на криптопей -->
  <video id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source src="https://raykedy.github.io/fastvideobackground_faststart.mp4" type="video/mp4">
  </video>

  <main class="page">
    <section class="card" aria-label="Оплата подтверждена">
      <h1>Спасибо! Платёж подтверждён</h1>
      <p class="muted">
        Мы отправили ссылку на e-mail. Если письма нет пару минут — нажмите кнопку ниже.<br>
        Ссылка активна 1 час. Если письма нет во «Входящих», проверьте папки «Промоакции» и «Спам».
      </p>

      <button id="resendBtn" class="btn">📧 Переслать письмо</button>

      <div id="msg" class="ok" hidden>Готово: ссылка отправлена на почту.</div>
      <div id="err" class="err"></div>
    </section>
  </main>

  <script>
    const params   = new URLSearchParams(location.search);
    const orderId  = params.get('order') || '';
    const resendBtn= document.getElementById('resendBtn');
    const msg      = document.getElementById('msg');
    const err      = document.getElementById('err');

    function show(el, text){ el.textContent = text; el.hidden = !text; }
    function showErr(text){ err.textContent = text; err.classList.add('show'); }
    function clearErr(){ err.textContent = ''; err.classList.remove('show'); }

    // Ручная пересылка письма — функционал без изменений
    resendBtn.addEventListener('click', async ()=>{
      resendBtn.disabled = true; clearErr(); show(msg,'');
      try{
        const email = prompt('Укажите e-mail, на который отправить ссылку:');
        if (!email){ resendBtn.disabled = false; return; }

        const r = await fetch('/api/resend', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ orderId, email })
        });
        const d = await r.json();
        if (d.ok) show(msg, 'Готово: ссылка отправлена на почту.');
        else showErr('Не удалось отправить письмо. Попробуйте ещё раз.');
      }catch(e){
        showErr('Ошибка сети. Попробуйте ещё раз.');
      }finally{
        resendBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
