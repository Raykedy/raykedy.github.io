<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />

  <title>2051: Алгоритм Пробуждение — Аудиокнига</title>

  <meta
    name="description"
    content="Официальная страница аудиокниги «2051: Алгоритм Пробуждение»."
  />

  <meta name="theme-color" content="#0ea15a" />

  <link rel="icon" href="/favicon.ico" />

  <style>
    :root {
      --fg: #e7f2ec;
      --muted: #9fb4aa;
      --accent: #0ea15a;
      --accent-2: #ff6a00;
      --border: rgba(255, 255, 255, 0.15);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --max: 800px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--fg);
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Ubuntu,
        "Helvetica Neue",
        Arial,
        "Noto Sans",
        sans-serif;
      line-height: 1.55;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
    }

    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      background: #000;
    }

    .wrap {
      width: 100%;
      max-width: var(--max);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .card {
      background: rgba(17, 23, 28, 0.30);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow:
        0 0 20px rgba(14, 161, 90, 0.2),
        0 0 40px rgba(255, 106, 0, 0.12),
        var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: clamp(24px, 3.5vw, 40px);
      margin-top: clamp(-70px, -30px, -20px);
    }

    .hero h2 {
      font-size: clamp(26px, 5vw, 40px);
      line-height: 1.15;
      margin: 6px 0 14px;
      font-weight: 800;
      background: linear-gradient(
        90deg,
        var(--accent-2),
        var(--accent)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      margin: 0 auto 24px;
      color: var(--muted);
      font-size: clamp(15px, 4vw, 18px);
      max-width: 640px;
    }

    .stores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .store-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(17, 23, 28, 0.65);
      border: 1px solid var(--border);
      color: var(--fg);
      transition: all 0.15s ease;
    }

    .store-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    .store-btn img {
      height: 22px;
      width: 22px;
      display: block;
      object-fit: contain;
    }

    .store-btn svg {
      height: 22px;
      width: 22px;
      display: block;
      fill: #fff;
      flex-shrink: 0;
    }

    .apple-logo {
      filter: invert(1);
    }

    @media (max-width: 500px) {
      .stores {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <video id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source
      src="https://raykedy.github.io/fastvideobackground_faststart.webm"
      type="video/webm"
    />

    <source
      src="https://raykedy.github.io/fastvideobackground_faststart.mp4"
      type="video/mp4"
    />
  </video>

  <main class="wrap">
    <section class="card">
      <div class="hero">
        <h2>Купить и слушать аудиокнигу</h2>

        <p>
          Выберите удобную платформу для покупки и прослушивания
          аудиокниги «2051: Алгоритм Пробуждение».
        </p>
      </div>

      <div class="stores">

        <a
          class="store-btn"
          href="https://play.google.com/store/audiobooks/details/%D0%A0%D1%8D%D0%B9_%D0%9A%D0%B5%D0%B4%D0%B8_2051_%D0%90%D0%BB%D0%B3%D0%BE%D1%80%D0%B8%D1%82%D0%BC_%D0%9F%D1%80%D0%BE%D0%B1%D1%83%D0%B6%D0%B4%D0%B5%D0%BD%D0%B8%D0%B5?id=AQAAAEB64W6hBM"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M3.2 2.4c-.4.5-.6 1.1-.6 1.9v15.4c0 .8.2 1.4.6 1.9L13 12 3.2 2.4zm11 10.7-2.5-2.5L4.7 3.7c.4-.2.8-.1 1.3.2l11 6.3-2.8 2.9zm3.8-2.2 1.7 1c1 .6 1.4 1.3 1.4 2.1 0 .8-.4 1.5-1.4 2.1l-1.7 1-3.1-3.1 3.1-3.1zm-3.8 4 2.8 2.9-11 6.3c-.5.3-.9.4-1.3.2l7-6.9 2.5-2.5z"
            />
          </svg>

          <span>Google Play Books</span>
        </a>

        <a
          class="store-btn"
          href="https://www.kobo.com/us/en/audiobook/K0vOml8u2DW-4nz7m3pbpA?sId=a0c7ba99-6215-4dff-8b13-a2b94b26d0c7&amp;ssId=Ddxm2_zoV-B4-QrRu-7Gl&amp;cPos=1"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="https://www.kobo.com/favicon.ico"
            alt=""
          />

          <span>Rakuten Kobo</span>
        </a>

        <a
          class="store-btn"
          href="https://books.apple.com/us/audiobook/2051-%D0%B0%D0%BB%D0%B3%D0%BE%D1%80%D0%B8%D1%82%D0%BC-%D0%BF%D1%80%D0%BE%D0%B1%D1%83%D0%B6%D0%B4%D0%B5%D0%BD%D0%B8%D0%B5-%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%81-%D1%83%D0%B6%D0%B5-%D0%B7%D0%B0%D0%BF%D1%83%D1%89%D0%B5%D0%BD/id6787144377?uo=4"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="apple-logo"
            src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg"
            alt=""
          />

          <span>Apple Books</span>
        </a>

        <a
          class="store-btn"
          href="https://libro.fm/audiobooks/9780466407766-2051"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="https://libro.fm/favicon.ico"
            alt=""
          />

          <span>Libro.fm</span>
        </a>

      </div>
    </section>
  </main>
</body>
</html>
